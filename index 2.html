<style>
:root{--bg:#fbf3f3;--card:#fff;--tx:#2a1215;--mu:#7a5a5e;--ac:#e11d2e;--ac2:#ff6a3d;--ok:#16a34a;--bd:#f0d9db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#140a0c;--card:#231216;--tx:#fff0f1;--mu:#c9a0a6;--bd:#3d1f25}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#140a0c;--card:#231216;--tx:#fff0f1;--mu:#c9a0a6;--bd:#3d1f25}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,Segoe UI,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:auto;padding:12px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 4px}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.mu{color:var(--mu);font-size:13px}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.t{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--bd);margin:6px 0;cursor:pointer;transition:.15s}
.t.on{background:color-mix(in srgb,var(--ok) 15%,var(--card));border-color:var(--ok)}.t.on b{text-decoration:line-through;opacity:.7}.t.sk{opacity:.5}
.t u{width:24px;height:24px;border:2px solid var(--mu);border-radius:8px;flex:none;display:grid;place-items:center;text-decoration:none}.t.on u{background:var(--ok);border-color:var(--ok);color:#fff}
.t span{margin-left:auto;font-size:12px;color:var(--ac);white-space:nowrap}
button,input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button:active{transform:scale(.96)}
textarea,input[type=text]{width:100%}textarea{min-height:60px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mu);border:0;font-size:11px;padding:4px 6px}nav button.on{color:var(--ac)}nav b{display:block;font-size:20px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--bd);font-size:12px;margin:2px}
.stat{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:8px}.stat b{font-size:20px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}.cal div{padding:8px 0;border-radius:8px;background:var(--bg)}
.l1{background:color-mix(in srgb,var(--ac) 30%,var(--bg))!important}.l2{background:color-mix(in srgb,var(--ac) 60%,var(--bg))!important}.l3{background:var(--ac)!important;color:#fff}
.tdy{outline:2px solid var(--ac2)}
#ov{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:9;text-align:center;color:#fff}#ov.s{display:grid}#ov div{animation:pop .6s}@keyframes pop{from{transform:scale(.2) rotate(-10deg);opacity:0}}
#ov h1{font-size:44px}
#to{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 16px;border-radius:99px;opacity:0;transition:.3s;z-index:8;pointer-events:none}#to.s{opacity:1}
.big{font-size:42px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
</style></head><body>
<main><div class="top"><h1>🏒 Level Up Daily</h1><button class="g" onclick="A('theme')" id="tb">🌙</button></div><div id="v"></div></main>
<nav id="nv"></nav><div id="ov" onclick="this.className=''"><div><h1>⭐ LEVEL UP! ⭐</h1><p id="ol" style="font-size:22px"></p><p>Tap to continue</p></div></div><div id="to"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem('lud'))||{}}catch(e){}
S=Object.assign({done:{},j:{},xp:0,spent:0,hk:{},co:{},bj:{},rw:[],sch:{},boss:{},ck:{},set:{theme:'',notif:false,time:'18:00',last:''},focus:0,rl:{},rst:0,goals:{}},S);
const save=()=>{try{localStorage.setItem('lud',JSON.stringify(S))}catch(e){}};
const ds=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const T=ds(),dow=new Date().getDay(),lvl=()=>Math.floor(S.xp/100)+1;let tab=0,calM=new Date();
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TASKS=[['🌅 Morning',[['m1','Get out of bed on time'],['m2','Make my bed'],['m3','Get ready for school'],['m4','Say a short prayer'],['m5','Remember one thing I’m grateful for']]],
['🎒 After School',[['a1','Complete homework and responsibilities',15],['a2','TRAIN','15'],['a3','Complete my Bible reading'],['a4','KIND']]],
['🌙 Evening',[['e1','Reflect on my day'],['e2','Write down one thing I did well'],['e3','Prepare for tomorrow'],['e4','Get enough sleep']]]];
const W=[['Rest Day 😌','Rest from structured training|Relax|Spend time with family|Reflect on the week'],
['Strength Day A 💪','Warm-up: 2 min marching or light jogging|10 arm circles|10 gentle leg swings per side|10 easy bodyweight squats|Bodyweight squats: 2 sets of 10|Wall or knee push-ups: 2 sets of 6–10|Glute bridges: 2 sets of 12|Bird dogs: 2 sets of 8 per side|Plank: 2 sets of 15–20 seconds'],
['Hockey Skills 🏒','Stickhandling: 5 min|Forehand and backhand control: 5 min|Passing practice: 5 min|Shooting practice: 5 min|Skating balance and control: 5 min'],
['Recovery 🧘','Gentle stretching|Easy walking or relaxed movement|Drink water regularly|Get enough sleep|No hard workout'],
['Strength Day B 💪','Warm-up: 2 min marching|Arm circles|Gentle leg swings|Easy squats|Reverse lunges: 2 sets of 6 per leg|Wall or knee push-ups: 2 sets of 6–10|Calf raises: 2 sets of 12|Dead bugs: 2 sets of 8 per side|Side plank: 2 sets of 10–15 seconds per side'],
['Hockey Skills 🏒','Stickhandling: 5 min|Passing: 5 min|Shooting: 5 min|Turning and stopping practice: 5 min|Skating technique: 5 min'],
['FUN Hockey Day 🎉','Play hockey|Practice your favorite skills|Work on something you learned this week|Enjoy playing without worrying about performance']];
const H=[['Stickhandling','Keep the ball close with soft hands. Work forehand, backhand, and side to side, with your head up.','Move the ball side to side for 3 minutes without looking down.'],
['Shooting','Wrist shots: weight shifts from back foot to front, wrists snap through. Start stationary, then safe angles.','Take 20 wrist shots at a target; count how many hit it.'],
['Passing','Cup the pass, follow through to your target, and receive with soft hands. Then try it while moving.','Make 10 forehand passes to a wall or partner, then 10 while moving.'],
['Skating','Stay balanced with bent knees. Learn acceleration, safe stopping and turning. Backward skating only with supervision.','Practice 5 stops each side and 5 turns each way.'],
['Hockey IQ','Know your position, find open space, pass at the right time, communicate, and understand offense and defense jobs.','Watch a game for 10 minutes and name where you’d stand on each play.']];
const B=[['Psalm 23','Trusting God and finding peace.','What am I thankful for?','What do I need God’s help with?'],
['Matthew 5:1–12','Being a good person and following Jesus.','What does Jesus teach me here?','How can I apply this today?'],
['Ephesians 4:25–32','Honesty, kindness, forgiveness, and controlling my words.','Did I use my words to help people today?','Is there someone I need to apologize to?'],
['Proverbs 16','Wisdom, humility, and trusting God.','Am I making good decisions?','Am I trusting God?'],
['Luke 6:27–36','Loving others and treating people well.','How can I treat someone better today?','Can I show kindness to someone who annoys me?'],
['1 Corinthians 13','Love, patience, and kindness.','Was I patient today?','Did I show genuine kindness?'],
['Philippians 2:1–11','Humility and putting others first.','Did I put others down or build them up?','How can I be more humble?']];
const K=['Reflect on how you treated others.','Give someone a genuine compliment.','Help someone without being asked.','Include someone who feels left out.','Avoid gossip and hurtful jokes.','Thank someone who has helped you.','Do something kind for your family.'];
const CH=['Be honest','Keep promises','Respect people','Listen before responding','Admit when I’m wrong','Apologize when necessary','Don’t make fun of people to get laughs','Encourage others'];
const C=['Write down three things you like about your personality.','Practice positive self-talk.','Share an opinion respectfully.','Try something new.','Stop comparing yourself to someone else.','Do something independently.','Reflect on your progress.','Say hello to someone new.','Ask someone about their interests.','Practice listening without interrupting.','Start a conversation.','Give someone a compliment.','Spend time with a friend.','Reflect on your progress.','Remember that girls are normal people.','Have a friendly conversation.','Ask about a hobby.','Talk about a shared interest.','Practice being yourself.','Be respectful and a good listener.','Reflect on your progress.','Write down what makes a good friend.','Write down what makes a healthy relationship.','Practice expressing your feelings respectfully.','Learn how to handle disappointment.','Practice accepting different opinions.','Do something thoughtful for someone.','Reflect on how you’ve grown.','Choose one habit to keep.','Celebrate your progress!'];
const WK=['Week 1: Confidence','Week 2: Social Skills','Week 3: Talking to Girls','Week 4: Relationships & Growth'];
const BOSS=['Learn a new hockey skill','Complete my planned workouts','Read the Bible every day','Show kindness to five people','Start three friendly conversations','Complete all my homework on time'];
const JQ=['What did I do well today?','What could I improve?','Did I treat people kindly?','Did I make progress with hockey?','Did I spend time with God?','What am I grateful for?','What is my goal for tomorrow?'];
const PRAYER='Dear God, thank You for another day. Help me become stronger, kinder, wiser, and more patient. Help me make good decisions, treat others with love, and grow closer to You. Help me with hockey, school, friendships, and everything I face today. In Jesus’ name, Amen.';
const xpOf=id=>id=='a1'||id=='a2'?15:10;
function toast(m){const t=$('#to');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1500)}
function addXP(n,m){const b=lvl();S.xp=Math.max(0,S.xp+n);if(lvl()>b){$('#ol').textContent='You reached Level '+lvl()+'!';$('#ov').className='s'}else if(n>0)toast('+'+n+' XP '+(m||''));save()}
const day=d=>S.done[d]||(S.done[d]={}),cnt=d=>Object.values(S.done[d]||{}).filter(v=>v==1).length;
function streak(){let n=0,d=new Date();if(!cnt(ds(d)))d.setDate(d.getDate()-1);while(cnt(ds(d))){n++;d.setDate(d.getDate()-1)}return n}
function wstreak(){let n=0,d=new Date();d.setDate(d.getDate()-d.getDay());for(let w=0;w<52;w++){let a=0;for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(cnt(ds(x)))a++}if(a>=3)n++;else if(w)break;d.setDate(d.getDate()-7)}return n}
function sumIds(ids,days){let n=0;for(let i=0;i<days;i++){const d=new Date();d.setDate(d.getDate()-i);ids.forEach(x=>{if((S.done[ds(d)]||{})[x]==1)n++})}return n}
const wkKey=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return ds(d)};
function plan(){return (S.sch[dow]!=null?S.sch[dow]:W[dow][1])}
function task(id,l,x,tt){const v=(S.done[T]||{})[id];if(l=='TRAIN')l='Today’s training: '+W[dow][0];if(l=='KIND')l='Kindness/courage: '+K[dow];
return `<div class="t ${v==1?'on':''} ${v==2?'sk':''}" onclick="A('tg','${id}')"><u>${v==1?'✓':''}</u><b>${esc(l)}</b><span>${v==2?'skipped':'+'+(x||xpOf(id))+' XP'}</span></div>`}
const VIEWS=[()=>{const l=lvl(),p=S.xp%100,done=cnt(T);
let h=`<div class="card"><div class="row sp"><h3>Level ${l} 🎮</h3><span class="mu">${S.xp} XP total</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="mu">${100-p} XP to Level ${l+1}</div>
<div class="row" style="margin-top:10px"><div class="stat"><b>🔥${streak()}</b>day streak</div><div class="stat"><b>📅${wstreak()}</b>week streak</div><div class="stat"><b>✅${done}</b>done today</div></div><p class="mu" style="margin:8px 0 0">Missed a day? No problem — just start again today. 💪</p></div>`;
TASKS.forEach(g=>{h+=`<h2>${g[0]}</h2>`+g[1].map(t=>task(t[0],t[1],t[2])).join('')});
h+=`<p class="mu">Tired or hurting? Tap “skip” — no penalty. <button class="g" onclick="A('skip')">Skip today’s training</button></p>`;
const bk=wkKey(),bi=Math.floor(new Date(bk).getTime()/6048e5)%6;
h+=`<h2>👑 Weekly Boss${dow==0?' (new today!)':''}</h2><div class="t ${S.boss[bk]?'on':''}" onclick="A('boss','${bk}')"><u>${S.boss[bk]?'✓':''}</u><b>${BOSS[bi]}</b><span>+100 XP</span></div>`;return h},
()=>{let h=`<div class="card"><b>Safety first:</b> these are beginner starting points. Have a parent or coach check your technique. Stop if anything hurts, never train through pain, and take it easy when tired. If you have a hard practice or game, adjust instead of adding more. This is about skill and strength — not weight or looks.</div>`;
h+=`<h2>📅 This week</h2>`;W.forEach((w,i)=>{const o=i==dow;h+=`<div class="card" ${o?'style="border-color:var(--ac2)"':''}><div class="row sp"><h3>${DN[i]} — ${w[0]}</h3>${o?'<span class="pill">TODAY</span>':''}</div><ul style="margin:6px 0;padding-left:20px">${plan2(i).split('|').map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><button class="g" onclick="A('edit',${i})">✏️ Edit</button></div>`});
h+=`<h2>🏒 Hockey Development</h2>`;H.forEach((s,i)=>{const n=S.hk[i]||0;h+=`<div class="card"><h3>${s[0]}</h3><p>${s[1]}</p><p><b>Challenge:</b> ${s[2]}</p><div class="row sp"><span class="mu">Sessions: <b>${n}</b> · Level ${Math.floor(n/5)+1}</span><button onclick="A('hk',${i})">+1 session (+10 XP)</button></div><div class="bar"><i style="width:${n%5*20}%"></i></div></div>`});return h},
()=>{const b=B[dow],d=day(T),bj=S.bj[T]||['',''],rd=d.a3==1;
let h=`<div class="card"><h3>✝️ ${DN[dow]}: ${b[0]}</h3><p class="mu">${b[1]}</p><div class="t ${rd?'on':''}" onclick="A('tg','a3');A('go',2)"><u>${rd?'✓':''}</u><b>I read it today</b><span>+10 XP</span></div></div>
<div class="card"><h3>Reflect</h3>${[2,3].map((q,i)=>`<p style="margin:8px 0 4px">${b[q]}</p><textarea oninput="A('bj',${i},this.value)">${esc(bj[i])}</textarea>`).join('')}</div>
<div class="card"><h3>🙏 Prayer prompt</h3><p><i>${PRAYER}</i></p><div class="t ${d.m4==1?'on':''}" onclick="A('tg','m4');A('go',2)"><u>${d.m4==1?'✓':''}</u><b>I prayed today</b><span>+10 XP</span></div></div><h2>This week’s faith progress</h2><div class="card">`;
const done=B.map((x,i)=>{const dd=new Date();dd.setDate(dd.getDate()-dow+i);return (S.done[ds(dd)]||{}).a3==1});
h+=B.map((x,i)=>`<span class="pill" style="${done[i]?'background:var(--ok);color:#fff':''}">${DN[i].slice(0,3)} ${done[i]?'✓':'·'}</span>`).join('')+`<p class="mu">${done.filter(Boolean).length}/7 readings this week</p></div>`;
const hist=Object.keys(S.bj).sort().reverse().filter(k=>S.bj[k][0]||S.bj[k][1]).slice(0,5);

{e:'🌱',t:'Stage 1: Become Someone You’re Proud Of',d:'Confidence comes from taking care of yourself and being kind. Start here — it makes every other stage easier.',s:['Write 3 things you’re proud of about yourself','Pick one hobby or interest to get better at this month','Take care of yourself 3 days in a row: sleep, shower, clean clothes you feel good in','Do one kind, respectful thing without telling anyone','Practice a clear, calm voice: say hello and your name out loud','Practice being yourself: say “I’m not sure, what do you think?” instead of pretending'],x:''},

{e:'🤝',t:'Stage 4: Build a Connection',d:'Connection grows from curiosity and kindness, not tricks or lines.',s:['Learn 3 things about someone: hobbies, family, goals','Listen without interrupting, then say back what you heard: “So you like…”','Remember something they told you and follow up later','Share something real about yourself','Notice and respect personal space','Check: am I being the real me, or pretending?'],x:'<p class="mu"><b>Boundaries:</b> “no” and “not sure” both mean stop. Never touch, tease, or press someone to share more than they want to. Respecting space makes people trust you.</p>'},
